name: 'Sync Issues and PRs'
description: 'Sync GitHub issues and pull requests to markdown files'
branding:
  icon: 'file-text'
  color: 'blue'

inputs:
  token:
    description: 'GitHub token with repo access (defaults to github.token)'
    required: false
    default: ${{ github.token }}
  output-dir:
    description: 'Directory to store synced markdown files'
    required: false
    default: 'synced-issues'
  sync-issues:
    description: 'Whether to sync issues'
    required: false
    default: 'true'
  sync-prs:
    description: 'Whether to sync pull requests'
    required: false
    default: 'true'
  include-closed:
    description: 'Whether to include closed issues/PRs'
    required: false
    default: 'false'
  app-id:
    description: 'GitHub App ID (optional)'
    required: false
  app-private-key:
    description: 'GitHub App private key (PEM, optional)'
    required: false
  updated-since:
    description: 'Only sync items updated after this ISO8601 timestamp'
    required: false
  issues-filter:
    description: 'Comma-separated issue numbers and/or inclusive ranges (e.g. 1,5,10-20). When set, only these issues are synced.'
    required: false
  prs-filter:
    description: 'Comma-separated pull request numbers and/or inclusive ranges (e.g. 1,5,10-20). When set, only these pull requests are synced.'
    required: false
  format-command:
    description: 'Optional shell command run on the synced files after they are written, before outputs are set (e.g. to apply prettier or pre-commit fixes). Every {files} placeholder is replaced with the shell-quoted modified file paths; without a placeholder the command runs as-is. A failing command fails the action.'
    required: false
  state-file:
    description: 'Optional path to store last sync timestamp (use with cache)'
    required: false
  force-update:
    description: 'Re-write all synced files even if content is unchanged'
    required: false
    default: 'false'
  sync-sub-issues:
    description: 'Whether to sync sub-issue relationships via GraphQL'
    required: false
    default: 'true'

outputs:
  issues-count:
    description: 'Number of issues synced'
  prs-count:
    description: 'Number of PRs synced'
  last-synced-at:
    description: 'Timestamp when this action completed'
  modified-files:
    description: 'Comma-separated list of file paths that were created or modified'
  app-token:
    description: 'GitHub App installation token (if app credentials provided). Use for checkout/push operations.'
  github-token:
    description: 'Original GitHub token. Use for commit signing.'

runs:
  using: 'node24'
  main: 'dist/index.js'
