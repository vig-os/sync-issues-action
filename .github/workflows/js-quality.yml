# ESLint & Prettier (consumer-owned)
#
# The scaffold-managed ci.yml has a "Lint & Format" job, but it runs
# `just precommit` — the prek hook suite, which contains no JS linter or
# formatter at all. Without this workflow `npm run lint` / `npm run format`
# are only ever run by hand and rot invisibly (commit-action's #66 story).
#
# Deliberately a SEPARATE file from ci.yml (no edits to a managed workflow),
# same as dist-check.yml. Toolchain provisioning mirrors ci.yml: a leading
# resolve-toolchain job reads .vig-os and emits the delivery mode + container
# image (empty string => host runner in direnv/bare), and the job below runs
# the shared setup-devkit-toolchain composite so eslint/prettier run under the
# same pinned Node as the dev-shell.
#
# `just lint` / `just format-check` are the same recipes a developer runs
# locally, so a green CI here means a green tree there — no CI-only invocation
# to drift out of sync. format-check is the read-only counterpart of
# `just format`: it fails on unformatted code rather than rewriting it.
#
# Ported from vig-os/commit-action. Refs:
# https://github.com/vig-os/sync-issues-action/issues/106

name: JS Quality

on:  # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - dev
      - 'release/**'
      - main

permissions:
  contents: read
  packages: read

jobs:
  resolve-toolchain:
    name: Resolve toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
      image: ${{ steps.resolve.outputs.image }}
      image-tag: ${{ steps.resolve.outputs.image-tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          sparse-checkout: |
            .vig-os
            .github/actions/resolve-toolchain
          sparse-checkout-cone-mode: false

      - name: Resolve toolchain
        id: resolve
        uses: ./.github/actions/resolve-toolchain
        with:
          registry-token: ${{ secrets.GHCR_PULL_TOKEN || github.token }}
          registry-username: ${{ github.actor }}

  js-quality:
    name: ESLint & Prettier
    needs: [resolve-toolchain]
    runs-on: ubuntu-24.04
    # Empty image (direnv/bare) => runs on the host; non-empty => in-container.
    container:
      image: ${{ needs.resolve-toolchain.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_PULL_TOKEN || github.token }}
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up devkit toolchain
        uses: ./.github/actions/setup-devkit-toolchain
        with:
          mode: ${{ needs.resolve-toolchain.outputs.mode }}
          devkit-version: ${{ needs.resolve-toolchain.outputs.image-tag }}
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Install dependencies
        run: just sync

      - name: Lint
        run: just lint

      # Read-only: fails on unformatted code rather than rewriting it. Run
      # `just format` locally to fix.
      - name: Check formatting
        run: just format-check
