# CodeQL Static Analysis
#
# Runs GitHub CodeQL analysis on TypeScript source and GitHub Actions workflows.
#
# Triggers:
#   - Pull requests to dev, release/**, and main
#   - Pushes to main (post-merge analysis)
#   - Weekly schedule (catch newly disclosed patterns)

name: CodeQL

on:  # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - dev
      - 'release/**'
      - main
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - '.github/workflows/**'
  schedule:
    - cron: '15 2 * * 1'  # Monday at 02:15 UTC

permissions: {}  # restrict default; job declares its own

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      security-events: write   # upload SARIF results
      contents: read           # read repository
      actions: read            # required for private repos (harmless for public)

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript', 'actions']

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Initialize CodeQL
        uses: github/codeql-action/init@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a  # v4
        with:
          languages: ${{ matrix.language }}

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a  # v4
        with:
          category: '/language:${{ matrix.language }}'
