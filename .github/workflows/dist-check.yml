# Dist Freshness Gate (consumer-owned)
#
# Guards the committed ncc bundle against drift from src/. This is a JS GitHub
# Action: consumers execute the bundle directly (action.yml -> main:
# dist/index.js), so a forgotten `just bundle` ships a stale artifact while
# tests still pass against src/. This gate rebuilds the bundle with the pinned
# dev-shell toolchain and fails the PR when the committed dist/ differs,
# forcing a fresh bundle onto every commit that can reach a tag.
#
# Scoped to the release boundary: dev is NOT gated. Nothing ships from dev
# (only tags ship), so a stale bundle there is harmless and gating it would
# make every Renovate runtime-dep bump fail. Staleness inherited from dev
# surfaces on the release/X.Y.Z -> main draft PR right after prepare-release
# and is fixed by a bugfix PR to the release branch; release-extension.yml's
# finalize-time verification remains the hard guarantee that no tag is cut on
# a stale bundle.
#
# Deliberately a SEPARATE file from the scaffold-managed ci.yml (no edits to a
# managed workflow); the `Dist Check` job is wired as a required status check,
# so its `name:` is contractual — do not rename it.
#
# Toolchain provisioning mirrors ci.yml: a leading resolve-toolchain job reads
# .vig-os and emits the delivery mode + container image (empty string => host
# runner in direnv/bare), and the Dist Check job runs the shared
# setup-devkit-toolchain composite so the rebuild uses the same pinned Node as
# the dev-shell rather than a random setup-node version.
#
# The check is a `git status` on dist/ rather than a `git diff` so that it also
# fails on build output ncc starts emitting that nobody has committed yet
# (tracked artifacts are dist/index.js + dist/licenses.txt; everything else
# under dist/ is gitignored).
#
# Ported from vig-os/commit-action. Refs:
# https://github.com/vig-os/sync-issues-action/issues/106
#
# Triggers:
#   - Pull requests to release/** and main

name: Dist Check

on:  # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - 'release/**'
      - main

permissions:
  contents: read
  packages: read

jobs:
  resolve-toolchain:
    name: Resolve toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
      image: ${{ steps.resolve.outputs.image }}
      image-tag: ${{ steps.resolve.outputs.image-tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          sparse-checkout: |
            .vig-os
            .github/actions/resolve-toolchain
          sparse-checkout-cone-mode: false

      - name: Resolve toolchain
        id: resolve
        uses: ./.github/actions/resolve-toolchain
        with:
          registry-token: ${{ secrets.GHCR_PULL_TOKEN || github.token }}
          registry-username: ${{ github.actor }}

  dist-check:
    name: Dist Check
    needs: [resolve-toolchain]
    runs-on: ubuntu-24.04
    # Empty image (direnv/bare) => runs on the host; non-empty => in-container.
    container:
      image: ${{ needs.resolve-toolchain.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_PULL_TOKEN || github.token }}
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      # Mode-aware preamble: exports the in-image env in container mode, or
      # provisions the Nix dev-shell (direnv) / host toolchain (bare)
      # otherwise. After this, `just` works in every mode with the pinned Node.
      - name: Set up devkit toolchain
        uses: ./.github/actions/setup-devkit-toolchain
        with:
          mode: ${{ needs.resolve-toolchain.outputs.mode }}
          devkit-version: ${{ needs.resolve-toolchain.outputs.image-tag }}
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Install dependencies
        run: just sync

      - name: Rebuild bundle
        run: just bundle

      - name: Verify committed bundle is fresh
        run: |
          if [ -n "$(git status --porcelain -- dist/)" ]; then
            git --no-pager diff -- dist/
            git status --short -- dist/
            echo "::error::dist/ is out of date with src/. Run 'just bundle' and commit the refreshed bundle."
            exit 1
          fi
